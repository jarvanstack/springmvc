status = warn
name = DemoConfig

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%c]-%m%n

appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = ./log/logging.txt
appender.file.filePattern = ./log/logging-%d{yyyy-MM-dd}-%i.txt.gz
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss}] [%-5p] [method:%l]%n%m%n%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 5

rootLogger.level = debug
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

logger.mybatis.name = org.mybatis
logger.mybatis.level = debug
logger.sql.name = java.sql
logger.sql.level = debug
